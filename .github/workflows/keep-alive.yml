name: Check backend availability

on:
  schedule:
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check published posts API
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 15 --connect-timeout 20 --max-time 90 https://eduprado-backend.onrender.com/api/posts --output /tmp/posts.json
          python3 - <<'PY'
          import json
          with open('/tmp/posts.json') as response:
              posts = json.load(response)
          if not isinstance(posts, list) or not posts:
              raise SystemExit('Posts API did not return a non-empty list.')
          print(f'Posts API healthy: {len(posts)} published posts.')
          PY
