name: Keep Supabase and Render Alive

on:
  schedule:
    # Runs at 12:00 PM UTC every Monday, Wednesday, and Friday
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to wake up Render and keep Supabase active
        run: |
          echo "Pinging backend API..."
          curl -sS https://eduprado-backend.onrender.com/api/posts > /dev/null
          echo "Ping completed."
          
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Prevent workflow from being disabled
        uses: gautamkrishnar/keepalive-workflow@v2
